spring.application.name=backend
server.port=8080

# Optional untracked file for local development (see application-local.properties.example).
# Keep real credentials here or in environment variables - never in this tracked file.
spring.config.import=optional:file:./application-local.properties

# MySQL Database Configuration
# DB_PASSWORD has no default on purpose: the app refuses to start until it is provided.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bank?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
